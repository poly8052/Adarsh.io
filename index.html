<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Maker - Video se Shorts banao</title>
<style>
  :root { --bg:#0e1117; --card:#171b24; --line:#262c3a; --text:#e8ecf3; --muted:#8b95a7; --accent:#7c5cff; --ok:#2ecc71; --err:#ff5c6c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  header { text-align:center; margin: 16px 0 24px; }
  h1 { margin:0 0 6px; font-size: 28px; }
  header p { margin:0; color:var(--muted); }
  .badge { display:inline-block; margin-top:14px; padding:6px 14px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:14px; }
  .badge b { color: var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:16px; }
  .drop { border:2px dashed var(--line); border-radius:14px; padding:36px 16px; text-align:center; cursor:pointer; transition:.2s; }
  .drop:hover, .drop.over { border-color: var(--accent); background:#1b1f2b; }
  .drop .big { font-size: 40px; }
  .drop p { margin:8px 0 0; color:var(--muted); font-size:14px; }
  button, .btn { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 18px; font-size:15px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .bar { height:8px; background:var(--line); border-radius:8px; overflow:hidden; margin-top:12px; }
  .bar > div { height:100%; width:0%; background:var(--accent); transition: width .2s; }
  .status { margin:0; font-size:15px; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; vertical-align:-2px; margin-right:8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--err); }
  .clips { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:14px; margin-top:14px; }
  .clip { background:#10131a; border:1px solid var(--line); border-radius:14px; padding:10px; }
  .clip video { width:100%; border-radius:10px; aspect-ratio: 9/16; background:#000; }
  .clip h3 { font-size:14px; margin:10px 0; line-height:1.3; }
  .clip .btn { width:100%; text-align:center; }
  .hidden { display:none; }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 Clip Maker</h1>
    <p>Lambi video upload karo, AI se best moments ke vertical clips (captions ke saath) pao.</p>
    <div class="badge">Aaj ke bache clips: <b id="remaining">-</b> / <span id="limit">5</span></div>
  </header>

  <div class="card" id="uploadCard">
    <div class="drop" id="drop">
      <div class="big">⬆️</div>
      <strong>Video yahan chhodo ya tap karke chuno</strong>
      <p id="hint">MP4, MOV, MKV, WEBM</p>
    </div>
    <input type="file" id="file" accept="video/*" class="hidden">
  </div>

  <div class="card hidden" id="progressCard">
    <p class="status" id="status"></p>
    <div class="bar"><div id="barFill"></div></div>
  </div>

  <div class="card hidden" id="resultCard">
    <strong>Tumhare clips (24 ghante me delete ho jayenge)</strong>
    <div class="clips" id="clips"></div>
    <p style="margin-top:16px"><button id="again">Dusri video banao</button></p>
  </div>

  <footer>Sirf wahi videos upload karo jinke rights tumhare paas hon.</footer>
</div>

<script>
const $ = id => document.getElementById(id);
let busy = false;

async function loadUsage() {
  try {
    const r = await fetch('/api/usage');
    const u = await r.json();
    $('remaining').textContent = u.remaining;
    $('limit').textContent = u.limit;
    $('hint').textContent = `MP4, MOV, MKV, WEBM • max ${u.max_upload_mb} MB • max ${u.max_video_min} min`;
    return u;
  } catch (e) {}
}

function showError(msg) {
  $('uploadCard').classList.remove('hidden');
  $('progressCard').classList.remove('hidden');
  $('status').innerHTML = '<span class="error">' + msg + '</span>';
  $('barFill').style.width = '0%';
  busy = false;
  loadUsage();
}

function upload(file) {
  if (busy) return;
  busy = true;
  $('resultCard').classList.add('hidden');
  $('progressCard').classList.remove('hidden');
  $('status').innerHTML = '<span class="spinner"></span>Upload ho raha hai... 0%';
  $('barFill').style.width = '0%';

  const fd = new FormData();
  fd.append('file', file);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) {
      const p = Math.round(e.loaded / e.total * 100);
      $('barFill').style.width = p + '%';
      $('status').innerHTML = '<span class="spinner"></span>Upload ho raha hai... ' + p + '%';
    }
  };
  xhr.onerror = () => showError('Network error. Dobara try karo.');
  xhr.onload = () => {
    let data = {};
    try { data = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status !== 200) return showError(data.detail || 'Upload fail ho gaya.');
    $('uploadCard').classList.add('hidden');
    $('barFill').style.width = '100%';
    poll(data.job_id);
    loadUsage();
  };
  xhr.send(fd);
}

async function poll(jobId) {
  try {
    const r = await fetch('/api/job/' + jobId);
    const j = await r.json();
    if (!r.ok) return showError(j.detail || 'Job mila nahi.');
    if (j.status === 'error') return showError(j.error || 'Kuch gadbad ho gayi.');
    if (j.status === 'done') return showResults(j.clips);
    $('status').innerHTML = '<span class="spinner"></span>' + j.message;
  } catch (e) {}
  setTimeout(() => poll(jobId), 2000);
}

function showResults(clips) {
  busy = false;
  $('progressCard').classList.add('hidden');
  const box = $('clips');
  box.innerHTML = '';
  clips.forEach(c => {
    const d = document.createElement('div');
    d.className = 'clip';
    const v = document.createElement('video');
    v.src = c.url; v.controls = true; v.preload = 'metadata'; v.playsInline = true;
    const h = document.createElement('h3'); h.textContent = c.title;
    const a = document.createElement('a');
    a.className = 'btn'; a.href = c.url + '?dl=1'; a.textContent = '⬇ Download';
    d.append(v, h, a);
    box.appendChild(d);
  });
  $('resultCard').classList.remove('hidden');
  loadUsage();
}

const drop = $('drop'), fileInput = $('file');
drop.onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files[0]) upload(fileInput.files[0]); fileInput.value = ''; };
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) upload(f); });
$('again').onclick = () => { $('resultCard').classList.add('hidden'); $('progressCard').classList.add('hidden'); $('uploadCard').classList.remove('hidden'); };

loadUsage();
</script>
</body>
</html>
